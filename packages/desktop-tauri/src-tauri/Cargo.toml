[package]
name = "marktext-tauri"
version = "0.22.0-dev"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Same version wry uses, for debug-only access to WebKitGTK settings.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
