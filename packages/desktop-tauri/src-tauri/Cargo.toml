[package]
name = "marktext-tauri"
version = "0.22.0-dev"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chardetng = "1"
encoding_rs = "0.8"
notify = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Same versions wry uses: WebKitGTK for editing commands and debug console
# output, WebView2 for editing commands through the DevTools protocol.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
