<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MarkText</title>
    <!-- Same policy as packages/desktop/src/renderer/index.html, plus the
         sources Tauri needs: its IPC endpoint, the dev server socket, and the
         protocol that local images are loaded through (src/localImages.ts,
         src-tauri/src/images.rs). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
                  script-src 'self';
                  style-src 'self' 'unsafe-inline';
                  img-src * data: file: blob: mt-image: http://mt-image.localhost;
                  font-src 'self' data:;
                  connect-src 'self' ipc: http://ipc.localhost ws://localhost:1420;
                  "
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
